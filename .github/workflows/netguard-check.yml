# Compile checks for an intranet-only build.
#
# Build-time network access (crates.io, GitHub git dependencies, pub.dev, vcpkg) is
# expected here and is unrelated to the artifact's runtime egress policy. The Linux
# jobs prove that the source type-checks; the Windows job produces the real binaries
# and scans them for vendor strings.
name: netguard-check

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  hbb-common:
    name: hbb_common check + netguard tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hbb-common
      - name: Toolchain
        run: rustc -V && cargo -V
      - name: cargo check (all targets)
        run: cargo check -p hbb_common --all-targets
      - name: netguard unit tests
        run: cargo test -p hbb_common netguard -- --nocapture

  app-check:
    name: rustdesk crate check (linux, flutter feature)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: app-check
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true
      - name: Install native dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=20
          sudo apt-get install -y -o Acquire::Retries=5 -o Acquire::http::Timeout=30 \
            clang cmake nasm ninja-build pkg-config libclang-dev llvm-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxfixes-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libpulse-dev libva-dev libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libvpx-dev libaom-dev libyuv-dev libopus-dev libssl-dev libv4l-dev
      # Ubuntu 22.04 ships libyuv-dev without a pkg-config file; `scrap/build.rs`
      # probes it through pkg-config when the `linux-pkg-config` feature is on.
      - name: Provide libyuv.pc
        run: |
          sudo tee /usr/lib/x86_64-linux-gnu/pkgconfig/libyuv.pc >/dev/null <<'EOF'
          prefix=/usr
          libdir=${prefix}/lib/x86_64-linux-gnu
          includedir=${prefix}/include
          Name: libyuv
          Description: libyuv
          Version: 0.0
          Libs: -L${libdir} -lyuv
          Cflags: -I${includedir}
          EOF
          pkg-config --modversion libyuv
      - name: Cache bridge codegen binaries
        id: bin-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: frb-1.80.1-expand-1.0.95
      - name: Install bridge codegen
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
      - name: Resolve Dart packages
        run: cd flutter && flutter pub get
      - name: Generate flutter-rust bridge
        run: |
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
      - name: cargo check
        run: cargo check --features flutter,linux-pkg-config --lib --bins

  windows-artifact:
    name: windows release build + strings
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-artifact
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.6"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true
      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Cache vcpkg installed tree
        id: vcpkg-tree
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ env.VCPKG_COMMIT_ID }}-x64-windows-static
      - name: Install vcpkg dependencies
        if: steps.vcpkg-tree.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT" -name "*.log" | head -20 | while read -r log; do echo "== $log"; tail -80 "$log"; done
            exit 1
          fi
      - name: Cache bridge codegen binaries
        id: bin-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: frb-1.80.1-expand-1.0.95-windows
      - name: Install bridge codegen
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
      - name: Resolve Dart packages
        run: cd flutter; flutter pub get
      - name: Generate flutter-rust bridge
        run: |
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
      # No --locked: Cargo.lock still lists the removed dependencies and is rewritten here.
      - name: cargo build (release)
        run: cargo build --release --features flutter,hwcodec,vram --lib
      - name: flutter build windows
        run: cd flutter; flutter build windows --release
      - name: Build single-file portable
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q -r libs/portable/requirements.txt
          cd libs/portable
          python generate.py -f ../../flutter/build/windows/x64/runner/Release -o . -e ../../flutter/build/windows/x64/runner/Release/rustdesk.exe
          cargo build --release --locked
          cp target/release/rustdesk-portable-packer.exe ../../rustdesk-intranet-portable.exe
          ls -l ../../rustdesk-intranet-portable.exe
      - name: Locate artifacts
        shell: bash
        run: |
          ls -l target/release/librustdesk.dll
          ls -l flutter/build/windows/x64/runner/Release
      - name: Scan artifact strings
        run: python scripts/scan_strings.py target/release/librustdesk.dll flutter/build/windows/x64/runner/Release/data/app.so flutter/build/windows/x64/runner/Release/rustdesk.exe
      - name: Upload windows build
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-release
          path: |
            target/release/librustdesk.dll
            flutter/build/windows/x64/runner/Release
            rustdesk-intranet-portable.exe
          retention-days: 7
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p dist/rustdesk-intranet
          cp -r flutter/build/windows/x64/runner/Release dist/rustdesk-intranet/
          cp target/release/librustdesk.dll dist/rustdesk-intranet/Release/
          cp LICENCE NOTICE MODIFICATIONS.md README.md dist/rustdesk-intranet/
          cp rustdesk-intranet-portable.exe dist/
          cd dist && 7z a -tzip rustdesk-intranet-windows-x64.zip rustdesk-intranet
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}"             dist/rustdesk-intranet-windows-x64.zip             dist/rustdesk-intranet-portable.exe             --title "${{ github.ref_name }}"             --notes "Windows x64 builds from source at ${{ github.sha }}. rustdesk-intranet-portable.exe is a single-file portable build; the zip is the full directory. Configure your intranet ranges in intranet-allowlist.conf; see README."
